<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 1. Page Title & Leaflet Map Styles -->
    <title>Oweru | Register Estate</title>
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- 2. Search Engine SEO Metadata -->
    <meta name="description" content="Find premium land, commercial areas, and plots for sale by certified agents on Oweru." />

    <!-- 3. Open Graph Metadata (For WhatsApp, Telegram, Link Previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oweru.com" />
    <meta property="og:title" content="Oweru Real Estate - Land, Plots & Commercial Areas" />
    <meta property="og:description" content="Find premium land, commercial areas, and plots for sale by certified agents on Oweru." />
    <!-- ⚠️ Must point to the hosted absolute PNG path, not the relative SVG -->
    <meta property="og:image" content="https://oweru.comassets/comthumbnail.png" />

    <!-- 4. Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oweru Real Estate - Land, Plots & Commercial Areas" />
    <meta name="twitter:description" content="Find premium land, commercial areas, and plots for sale by certified agents on Oweru." />
    <meta name="twitter:image" content="https://oweru.comassets/comthumbnail.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
