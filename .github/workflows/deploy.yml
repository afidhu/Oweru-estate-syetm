name: React Live Deploy (Monorepo)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Up Node and Compile Code
        run: |
          npm install
          npm run build

      - name: Push Build Folder Content Live via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "frontend/dist/*"
          target: "/home/oweru-sale/htdocs/sale.oweru.com/"
          strip_components: 2
          debug: true
