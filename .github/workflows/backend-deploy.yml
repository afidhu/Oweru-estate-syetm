name: NestJS Backend Live Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}

          script: |
            set -e

            echo "======================================"
            echo "🚀 Starting NestJS Backend Deployment"
            echo "======================================"

            cd /home/oweru-saleapi/htdocs/saleapi.oweru.com

            echo "📥 Pulling latest backend code..."
            git pull origin main

            echo "📦 Installing dependencies..."
            npm install

            echo "🔧 Generating Prisma Client..."
            npx prisma generate

            echo "🏗️ Building NestJS application..."
            npm run build

            echo "🗄️ Applying Prisma migrations..."
            npx prisma migrate deploy

            echo "🚀 Starting/Restarting PM2..."

            if pm2 describe sale-nestjs-api > /dev/null; then
              pm2 restart sale-nestjs-api
            else
              pm2 start dist/main.js --name sale-nestjs-api
            fi

            pm2 save

            echo "======================================"
            echo "✅ Backend deployment completed!"
            echo "======================================"
